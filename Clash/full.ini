[custom]
; 精简版分流：高优先级特例先匹配，CN/GeoIP 后匹配。

; 1. 特例规则，顺序不要下移到 CN 规则之后。
ruleset=Schwab直连,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Direct/schwab.list
ruleset=券商代理,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Proxy/broker.list
ruleset=OneDrive上传直连,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Direct/onedrive-upload.list
ruleset=OneDrive登录代理,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Proxy/onedrive-login.list
ruleset=Docker镜像代理,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Proxy/docker.list
ruleset=海外AI代理,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Proxy/ai.list

; 2. 基础直连。
ruleset=全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
ruleset=全球直连,[]GEOIP,LAN
ruleset=全球直连,[]GEOIP,CN

; 3. 其他代理：不再细分媒体/游戏/软件平台，统一进 GFWList-Full。
ruleset=GFWList-Full,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=GFWList-Full,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
ruleset=GFWList-Full,[]FINAL

custom_proxy_group=节点选择`select`[]自动选择`[]香港节点`[]台湾节点`[]新加坡节点`[]日本节点`[]美国节点`[]韩国节点`[]手动切换`[]DIRECT
custom_proxy_group=手动切换`select`.*
custom_proxy_group=自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=Schwab直连`select`[]DIRECT
custom_proxy_group=券商代理`select`[]节点选择`[]自动选择`[]香港节点`[]新加坡节点`[]日本节点`[]美国节点`[]手动切换
custom_proxy_group=OneDrive上传直连`select`[]DIRECT
custom_proxy_group=OneDrive登录代理`select`[]节点选择`[]自动选择`[]香港节点`[]新加坡节点`[]日本节点`[]美国节点`[]手动切换
custom_proxy_group=Docker镜像代理`select`[]节点选择`[]自动选择`[]香港节点`[]日本节点`[]美国节点`[]手动切换
custom_proxy_group=海外AI代理`select`[]美国节点`[]节点选择`[]自动选择`[]新加坡节点`[]日本节点`[]香港节点`[]手动切换
custom_proxy_group=全球直连`select`[]DIRECT
custom_proxy_group=GFWList-Full`select`[]节点选择`[]自动选择`[]香港节点`[]台湾节点`[]新加坡节点`[]日本节点`[]美国节点`[]韩国节点`[]手动切换

custom_proxy_group=香港节点`url-test`(港|HK|Hong Kong|HongKong|hongkong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=台湾节点`url-test`(台|TW|Taiwan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=新加坡节点`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=日本节点`url-test`(日本|东京|大阪|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=美国节点`url-test`(美|US|United States|America|洛杉矶|圣何塞|西雅图|纽约|达拉斯|硅谷)`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=韩国节点`url-test`(韩|KR|Korea|KOR|首尔)`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true

[custom]
; 精简分流：特例优先，其次国内直连，最后其余流量走代理。

; 1. 指定直连。
ruleset=直连,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Direct/schwab.list
ruleset=直连,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Direct/onedrive-upload.list

; 2. 指定走自建机器。
ruleset=自建机器,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Proxy/self-hosted.list

; 3. 自定义代理。券商、加密货币和指定域名规则位于 ChinaDomain/GEOIP,CN 之前。
ruleset=自定义代理,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Proxy/custom-proxy.list
ruleset=Broker,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Proxy/broker.list
ruleset=Broker,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/TigerFintech/TigerFintech.list
ruleset=加密货币,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Proxy/crypto.list
ruleset=加密货币,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Crypto/Crypto.list
ruleset=代理,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Proxy/onedrive-login.list
ruleset=代理,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Docker/Docker.list

; 4. AI。保留自定义补充，并引用 blackmatrix7 中所有 AI 相关 Clash list。
ruleset=AI,https://raw.githubusercontent.com/metaif/rules/refs/heads/master/Clash/Proxy/ai.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Anthropic/Anthropic.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/BardAI/BardAI.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Civitai/Civitai.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Claude/Claude.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Copilot/Copilot.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Gemini/Gemini.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/OpenAI/OpenAI.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/aiXcoder/aiXcoder.list

; 5. 流媒体先于 Google 匹配，使 YouTube 与 YouTube Music 使用独立出口。
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/YouTubeMusic/YouTubeMusic.list
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/YouTube/YouTube.list
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Spotify/Spotify.list
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/HBO/HBO.list
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Netflix/Netflix.list
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Disney/Disney.list
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/AmazonPrimeVideo/AmazonPrimeVideo.list
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Hulu/Hulu.list

; 6. 其余 Google 服务。AI 和流媒体已在前面匹配。
ruleset=Google服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Google/Google.list

; 7. 国内与局域网直连。ChinaDomain、China IP 和 CN GEOIP 均走直连。
ruleset=直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
ruleset=直连,[]GEOIP,LAN
ruleset=直连,[]GEOIP,CN

; 8. GFWList 与未命中流量统一进入通用代理。
ruleset=代理,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=代理,[]FINAL

; 主分组。
custom_proxy_group=代理`select`[]自建机器`[]家宽`[]自动`[]香港`[]台湾`[]新加坡`[]日本`[]美国`[]英国`[]法国`[]德国`[]土耳其`[]手动
custom_proxy_group=自定义代理`select`[]代理`[]家宽`[]自建机器`[]自动`[]香港`[]台湾`[]新加坡`[]日本`[]美国`[]英国`[]法国`[]德国`[]土耳其`[]手动`.*
custom_proxy_group=AI`select`[]家宽`[]美国`[]日本`[]新加坡`[]香港`[]台湾`[]英国`[]法国`[]德国`[]土耳其`[]自动`[]手动
custom_proxy_group=Google服务`select`[]家宽`[]美国`[]日本`[]新加坡`[]香港`[]台湾`[]英国`[]法国`[]德国`[]土耳其`[]自动`[]手动
custom_proxy_group=流媒体`select`[]家宽`[]自动`[]香港`[]台湾`[]新加坡`[]日本`[]美国`[]英国`[]法国`[]德国`[]土耳其`[]手动`.*
custom_proxy_group=Broker`select`[]DIRECT`[]自建机器`[]香港`[]台湾`[]新加坡`[]日本`[]美国`[]英国`[]法国`[]德国`[]土耳其`[]自动`[]手动
custom_proxy_group=加密货币`select`[]DIRECT`[]香港`[]新加坡`[]日本`[]台湾`[]自建机器`[]自动`[]手动
custom_proxy_group=直连`select`[]DIRECT
custom_proxy_group=手动`select`.*
custom_proxy_group=家宽`select`(家宽|家寬|住宅|Residential|residential|ISP)
custom_proxy_group=自动`url-test`.*`https://www.gstatic.com/generate_204`600,,50
custom_proxy_group=自建机器`select`(自建机器)

; 国家节点。
custom_proxy_group=美国`url-test`(美国|美國|US|USA|United States|America|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|达拉斯|達拉斯|硅谷)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group=日本`url-test`(日本|东京|東京|大阪|JP|Japan)`https://www.gstatic.com/generate_204`600,,50
custom_proxy_group=台湾`url-test`(台湾|台灣|台北|新北|彰化|TW|Taiwan)`https://www.gstatic.com/generate_204`600,,50
custom_proxy_group=香港`url-test`(香港|港|HK|Hong Kong|HongKong|hongkong)`https://www.gstatic.com/generate_204`600,,50
custom_proxy_group=新加坡`url-test`(新加坡|狮城|獅城|SG|Singapore)`https://www.gstatic.com/generate_204`600,,50
custom_proxy_group=英国`url-test`(英国|英國|UK|GB|United Kingdom|Britain|London|伦敦|倫敦)`https://www.gstatic.com/generate_204`600,,50
custom_proxy_group=法国`url-test`(法国|法國|FR|France|Paris|巴黎)`https://www.gstatic.com/generate_204`600,,50
custom_proxy_group=德国`url-test`(德国|德國|DE|Germany|Frankfurt|法兰克福|法蘭克福|Berlin|柏林)`https://www.gstatic.com/generate_204`600,,50
custom_proxy_group=土耳其`url-test`(土耳其|TR|Turkey|Türkiye|Turkiye|Istanbul|伊斯坦布尔|伊斯坦堡)`https://www.gstatic.com/generate_204`600,,50

enable_rule_generator=true
overwrite_original_rules=true
